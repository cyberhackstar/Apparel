<div class="min-h-screen flex items-center justify-center p-6 bg-ivory">
  <div class="w-full max-w-md">
    <p class="eyebrow mb-3">Account recovery</p>
    <h2 class="font-display text-3xl mb-2">Forgot your password?</h2>
    <p class="text-ink/60 font-body mb-8">Enter your email and we'll send you a code to reset it.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="font-body text-sm font-medium mb-1.5 block">Email</label>
        <input type="email" formControlName="email" class="input-field" placeholder="you@example.com" />
        @if (f.email.touched && f.email.invalid) {
          <p class="input-error">Please enter a valid email.</p>
        }
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="loading()">
        {{ loading() ? 'Sending…' : 'Send reset code' }}
      </button>
    </form>

    <a routerLink="/auth/login" class="block text-center font-body text-sm text-ink/40 mt-6 hover:text-ink/60">
      &larr; Back to login
    </a>
  </div>
</div>
