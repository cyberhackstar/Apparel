<div
  class="min-h-screen flex flex-col justify-center items-center px-4 sm:px-8 py-8 sm:py-12 bg-ivory"
>
  <!-- Mobile Brand Header -->
  <div class="w-full max-w-md mb-6 text-center sm:text-left">
    <a routerLink="/" class="font-display text-2xl text-wine inline-block"> Ladies Apparel </a>
  </div>

  <!-- Recovery Card Container -->
  <div
    class="w-full max-w-md bg-white sm:bg-transparent p-6 sm:p-0 rounded-petal-sm sm:rounded-none shadow-card sm:shadow-none border sm:border-0 border-ink/5 space-y-6"
  >
    <div>
      <p class="eyebrow text-wine text-xs uppercase tracking-widest font-semibold mb-2">
        Account recovery
      </p>
      <h1 class="font-display text-2xl sm:text-3xl text-ink">Forgot your password?</h1>
      <p class="text-xs sm:text-sm text-ink/60 font-body mt-1 leading-relaxed">
        Enter your registered email address and we'll send you a 6-digit code to reset your
        password.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="font-body text-xs sm:text-sm font-medium mb-1 block text-ink/70"
          >Email Address *</label
        >
        <input
          type="email"
          formControlName="email"
          class="input-field !py-2.5 text-xs sm:text-sm"
          placeholder="name@example.com"
          autocomplete="email"
        />
        @if (f.email.touched && f.email.invalid) {
          <p class="input-error mt-1 text-xs text-wine font-body">
            {{ getErrorMessage('email') }}
          </p>
        }
      </div>

      <button
        type="submit"
        class="btn-primary w-full !py-3 text-xs sm:text-sm font-semibold tracking-wide"
        [disabled]="loading()"
      >
        {{ loading() ? 'Sending code…' : 'Send reset code' }}
      </button>
    </form>

    <div class="text-center pt-2">
      <a
        routerLink="/auth/login"
        class="font-body text-xs sm:text-sm text-ink/50 hover:text-wine transition-colors inline-flex items-center gap-1"
      >
        &larr; Back to login
      </a>
    </div>
  </div>
</div>
