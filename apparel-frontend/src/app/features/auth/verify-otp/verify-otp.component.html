<div
  class="min-h-screen flex flex-col justify-center items-center px-4 sm:px-8 py-8 sm:py-12 bg-ivory"
>
  <!-- Brand Header -->
  <div class="w-full max-w-md mb-6 text-center">
    <a routerLink="/" class="font-display text-2xl text-wine inline-block"> Ladies Apparel </a>
  </div>

  <!-- Verification Card Container -->
  <div
    class="w-full max-w-md bg-white sm:bg-transparent p-6 sm:p-0 rounded-petal-sm sm:rounded-none shadow-card sm:shadow-none border sm:border-0 border-ink/5 text-center space-y-6"
  >
    <div>
      <p class="eyebrow text-wine text-xs uppercase tracking-widest font-semibold mb-2">
        Verify your email
      </p>
      <h1 class="font-display text-2xl sm:text-3xl text-ink">Enter the code</h1>
      <p class="text-xs sm:text-sm text-ink/60 font-body mt-1 leading-relaxed">
        We've sent a 6-digit verification code to
        <strong class="text-ink font-medium break-all block sm:inline mt-0.5 sm:mt-0">{{
          email
        }}</strong>
      </p>
    </div>

    <!-- 6-Pin Input Boxes Group -->
    <div class="flex justify-center gap-1.5 sm:gap-2.5 my-2" (paste)="onPaste($event)">
      @for (digit of digits; track $index) {
        <input
          #digitInput
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="1"
          autocomplete="one-time-code"
          class="w-10 h-13 sm:w-13 sm:h-16 text-center text-xl sm:text-2xl font-display font-bold bg-white border border-ink/15 rounded-petal-sm focus:outline-none focus:border-wine focus:ring-1 focus:ring-wine transition-all shadow-sm"
          [value]="digit"
          (input)="onDigitInput($index, $event)"
          (keydown)="onBackspace($index, $event)"
        />
      }
    </div>

    <!-- Submit Button -->
    <button
      class="btn-primary w-full !py-3 text-xs sm:text-sm font-semibold tracking-wide"
      [disabled]="!otpComplete || loading()"
      (click)="submit()"
    >
      {{ loading() ? 'Verifying…' : 'Verify account' }}
    </button>

    <!-- Resend & Cooldown Text -->
    <div class="space-y-3 pt-2 font-body text-xs sm:text-sm text-ink/60">
      <p>
        Didn't receive the code?
        @if (resendCountdown() > 0) {
          <span class="text-ink/40 font-medium ml-1">Resend in {{ resendCountdown() }}s</span>
        } @else {
          <button
            class="text-wine font-semibold hover:underline ml-1 disabled:opacity-50 inline-block"
            [disabled]="resending()"
            (click)="resend()"
          >
            {{ resending() ? 'Sending…' : 'Resend code' }}
          </button>
        }
      </p>

      <div>
        <a
          routerLink="/auth/register"
          class="text-ink/40 hover:text-wine transition-colors inline-flex items-center gap-1"
        >
          &larr; Back to sign up
        </a>
      </div>
    </div>
  </div>
</div>
