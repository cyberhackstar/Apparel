<div class="min-h-screen flex items-center justify-center p-6 bg-ivory">
  <div class="w-full max-w-md">
    <p class="eyebrow mb-3">Account recovery</p>
    <h2 class="font-display text-3xl mb-2">Set a new password</h2>
    <p class="text-ink/60 font-body mb-8">
      Enter the code sent to <span class="font-semibold text-ink">{{ email }}</span> and your new password.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="font-body text-sm font-medium mb-1.5 block">6-digit code</label>
        <input type="text" inputmode="numeric" formControlName="otp" class="input-field tracking-widest" placeholder="000000" />
        @if (f.otp.touched && f.otp.invalid) {
          <p class="input-error">Enter the 6-digit code from your email.</p>
        }
      </div>

      <div>
        <label class="font-body text-sm font-medium mb-1.5 block">New password</label>
        <input type="password" formControlName="newPassword" class="input-field" placeholder="At least 8 characters" />
        @if (f.newPassword.touched && f.newPassword.invalid) {
          <p class="input-error">Password must be at least 8 characters.</p>
        }
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="loading()">
        {{ loading() ? 'Resetting…' : 'Reset password' }}
      </button>
    </form>

    <a routerLink="/auth/login" class="block text-center font-body text-sm text-ink/40 mt-6 hover:text-ink/60">
      &larr; Back to login
    </a>
  </div>
</div>
