<div class="min-h-screen flex bg-[#F5F5F3]">
  <!-- Mobile Header -->
  <header
    class="lg:hidden fixed top-0 left-0 right-0 z-40 h-14 flex items-center justify-between px-4 bg-ink text-ivory"
  >
    <button (click)="toggleDrawer()" class="p-2 -ml-2" aria-label="Open menu">
      <svg width="22" height="22" viewBox="0 0 24 24" class="fill-none stroke-current stroke-2">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <p class="font-display text-base">Ladies Apparel</p>
    <span class="w-9"></span>
  </header>

  <!-- Drawer Backdrop -->
  @if (drawerOpen()) {
    <div class="lg:hidden fixed inset-0 bg-black/50 z-40" (click)="closeDrawer()"></div>
  }

  <!-- Sidebar Navigation -->
  <aside
    class="w-64 bg-ink text-ivory shrink-0 flex flex-col fixed lg:sticky top-0 h-screen z-50 transition-transform duration-200 ease-out lg:translate-x-0"
    [class.translate-x-0]="drawerOpen()"
    [class.-translate-x-full]="!drawerOpen()"
  >
    <div class="px-6 py-6 border-b border-ivory/10 flex items-center justify-between">
      <div>
        <p class="font-display text-xl">Ladies Apparel</p>
        <p class="font-body text-xs text-ivory/40 mt-0.5">Admin Panel</p>
      </div>
      <button (click)="closeDrawer()" class="lg:hidden p-1 text-ivory/60" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" class="fill-none stroke-current stroke-2">
          <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-wine text-ivory"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="flex items-center gap-3 px-3 py-2.5 rounded-petal-sm font-body text-sm text-ivory/70 hover:bg-ivory/5 hover:text-ivory transition-colors"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            class="fill-none stroke-current stroke-2 shrink-0"
          >
            <path [attr.d]="item.icon" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="px-3 py-4 border-t border-ivory/10">
      <a routerLink="/" class="block px-3 py-2 font-body text-sm text-ivory/50 hover:text-ivory"
        >&larr; Back to Storefront</a
      >
      <button
        (click)="logout()"
        class="w-full text-left px-3 py-2 font-body text-sm text-ivory/50 hover:text-ivory"
      >
        Log out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-x-hidden pt-14 pb-16 lg:pt-0 lg:pb-0">
    <router-outlet></router-outlet>
  </main>

  <!-- Mobile Bottom Tab Navigation -->
  <nav
    class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-ink/10 flex items-stretch"
  >
    @for (item of mobileTabItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="text-wine"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="flex-1 flex flex-col items-center justify-center py-2 text-ink/50 text-[11px] font-body gap-0.5"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          class="fill-none stroke-current stroke-[1.8]"
        >
          <path [attr.d]="item.icon" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ item.label }}
      </a>
    }
    <button
      (click)="toggleDrawer()"
      class="flex-1 flex flex-col items-center justify-center py-2 text-ink/50 text-[11px] font-body gap-0.5"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" class="fill-none stroke-current stroke-[1.8]">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      More
    </button>
  </nav>
</div>
